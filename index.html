function mergeLibrary(db){
  if(!Array.isArray(db.exercises)) db.exercises = [];
  const byId = new Map(db.exercises.map(e=>[e.id,e]));
  LIB.forEach(Lx=>{
    const cur = byId.get(Lx.id);
    if(!cur) db.exercises.push({...Lx, custom:false});
    else if(!cur.custom){ cur.grupo=Lx.grupo; cur.equip=Lx.equip; cur.prim=Lx.prim; cur.sec=Lx.sec; }
  });
  return db;
}

/* ============================= STORAGE ============================= */
const DB_KEY = 'cargaAppDB_v1';
function loadDB(){
  try {
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    return mergeLibrary(Object.assign(defaultDB(), parsed));
  } catch(e){ console.error('Erro ao carregar dados', e); return defaultDB(); }
}
function saveDB(){
  try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch(e){ console.error('Erro ao salvar dados', e); toast('Não foi possível salvar. Espaço de armazenamento cheio?'); }
}
function defaultDB(){
  return {
    profile: null,
    exercises: defaultExercises(),
    workouts: [],
    sessions: [],
    recovery: [],
    activeSessionId: null
  };
}
function defaultExercises(){ return LIB.map(e=>({...e, custom:false})); }
let DB = loadDB();

/* ============================= HELPERS ============================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function unit(){ return (DB.profile && DB.profile.unit) || 'kg'; }
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function fmt1(n){ return (Math.round(n*10)/10).toString().replace('.0',''); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function dateBR(iso){ const [y,m,d]=iso.slice(0,10).split('-'); return `${d}/${m}/${y}`; }
function exName(id){ const e=DB.exercises.find(x=>x.id===id); return e? e.nome : '—'; }
function exById(id){ return DB.exercises.find(x=>x.id===id); }
function rirToPse(rir){ return {0:10,1:9,2:8,3:7,4:6}[rir] ?? 6; }
function epley(carga, reps){ return carga * (1 + reps/30); }
let toastTimer=null;
function toast(msg){
  let el = document.getElementById('toastEl');
  if(!el){ el=document.createElement('div'); el.id='toastEl'; el.className='fixed left-1/2 -translate-x-1/2 bottom-24 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-lg'; document.body.appendChild(el); }
  el.style.background = 'var(--text)'; el.style.color = 'var(--bg)';
  el.textContent = msg; el.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity='0'; }, 2200);
}

/* ============================= ROUTER ============================= */
let ROUTE = { screen: DB.profile ? 'home' : 'onboarding', params:{} };
function nav(screen, params={}){ ROUTE = {screen, params}; render(); window.scrollTo(0,0); }
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(!DB.profile && ROUTE.screen!=='onboarding'){ ROUTE = {screen:'onboarding', params:{}}; }
  switch(ROUTE.screen){
    case 'onboarding': html = screenOnboarding(); break;
    case 'home': html = screenHome(); break;
    case 'workouts': html = screenWorkouts(); break;
    case 'workoutEdit': html = screenWorkoutEdit(ROUTE.params.id); break;
    case 'execution': html = screenExecution(); break;
    case 'summary': html = screenSummary(ROUTE.params.sessionId); break;
    case 'history': html = screenHistory(); break;
    case 'exerciseHistory': html = screenExerciseHistory(ROUTE.params.exId); break;
    case 'recovery': html = screenRecovery(); break;
    case 'settings': html = screenSettings(); break;
    case 'library': html = screenLibrary(); break;
    case 'exerciseDetail': html = screenExerciseDetail(ROUTE.params.id); break;
    case 'muscles': html = screenMuscles(); break;
    default: html = screenHome();
  }
  const showNav = DB.profile && !['onboarding','execution'].includes(ROUTE.screen);
  app.innerHTML = html + (showNav ? bottomNav() : '') + modalHTML();
  afterRender();
  syncWakeLock();
}

function weekSessions(){
  const now = new Date(); const day = now.getDay();
  const monday = new Date(now); monday.setDate(now.getDate() - ((day+6)%7)); monday.setHours(0,0,0,0);
  return DB.sessions.filter(s=>s.status==='finalizada' && new Date(s.end) >= monday);
}
function lastFinishedSession(){
  const list = DB.sessions.filter(s=>s.status==='finalizada').sort((a,b)=> new Date(b.end)-new Date(a.end));
  return list[0] || null;
}
function recentProgressions(limit=3){
  const out = [];
  const exIds = new Set();
  DB.sessions.filter(s=>s.status==='finalizada').forEach(s=>{ s.logs.forEach(l=>exIds.add(l.exId)); });
  exIds.forEach(exId=>{
    const hist = exerciseHistory(exId);
    if(hist.length>=2){
      const last = hist[hist.length-1], prev = hist[hist.length-2];
      if(last.bestLoad > prev.bestLoad){ out.push({exId, from:prev.bestLoad, to:last.bestLoad, date:last.date}); }
    }
  });
  return out.sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,limit);
}
function fadigaAlert(){
  const finished = DB.sessions.filter(s=>s.status==='finalizada').sort((a,b)=>new Date(a.end)-new Date(b.end));
  const last3 = finished.slice(-3);
  const recov = DB.recovery.slice(-3);
  let signals = 0;
  if(last3.length>=3){
    let regress=0;
    last3.forEach(s=>{ const recs = s.logs.map(l=>l.recommendation?.rec); if(recs.includes('manter_reduzir')) regress++; });
    if(regress>=2) signals++;
  }
  if(recov.length){
    const avgDisp = avg(recov.map(r=>r.disposicao));
    const avgDor = avg(recov.map(r=>r.dorMuscular));
    const avgSono = avg(recov.map(r=>r.sono));
    if(avgDisp<=2) signals++;
    if(avgDor>=4) signals++;
    if(avgSono<=2) signals++;
  }
  return signals>=2;
}

function suggestWorkout(){
  if(!DB.workouts.length) return null;
  const finished = DB.sessions.filter(s=>s.status==='finalizada').sort((a,b)=>new Date(b.end)-new Date(a.end));
  const lastWorkoutId = finished[0]?.workoutId;
  if(!lastWorkoutId) return DB.workouts[0];
  const idx = DB.workouts.findIndex(w=>w.id===lastWorkoutId);
  return DB.workouts[(idx+1) % DB.workouts.length] || DB.workouts[0];
}
function drawFrequencyMini(){
  const el = document.getElementById('freqMini'); if(!el || !window.Chart) return;
  const weeks = []; const counts = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate() - i*7);
    const day = d.getDay(); const monday = new Date(d); monday.setDate(d.getDate()-((day+6)%7)); monday.setHours(0,0,0,0);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+7);
    const c = DB.sessions.filter(s=>s.status==='finalizada' && new Date(s.end)>=monday && new Date(s.end)<sunday).length;
    weeks.push('S'+(6-i)); counts.push(c);
  }
  new Chart(el, { type:'bar', data:{ labels:weeks, datasets:[{data:counts, backgroundColor:getCss('--red'), borderRadius:4}]},
    options:{ plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false}, ticks:{color:getCss('--dim')}}, y:{display:false, beginAtZero:true} } } });
}

function createCustomExercise(wid){
  const nome = document.getElementById('cexName').value.trim();
  if(!nome){ toast('Digite um nome para o exercício.'); return; }
  const tipo = document.getElementById('cexTipo').value;
  const grupo = document.getElementById('cexGrupo').value;

/* ============================= EXECUTION ============================= */
function startSession(workoutId){
  const w = DB.workouts.find(x=>x.id===workoutId);
  if(!w || !w.exercicios.length){ toast('Este treino não tem exercícios. Edite-o antes de iniciar.'); return; }
  const session = {
    id: uid(), workoutId, workoutNome: w.nome, date: todayISO(), start: new Date().toISOString(), end:null,
    status:'em_andamento', currentExIdx:0,
    logs: w.exercicios.map(e=>({exId:e.exId, cfg:{...e}, sets:[], recommendation:null}))
  };
  DB.sessions.push(session);
  DB.activeSessionId = session.id;
  saveDB();
  nav('execution');
}
function activeSession(){ return DB.sessions.find(s=>s.id===DB.activeSessionId && s.status==='em_andamento'); }

function exerciseHistory(exId){
  // returns array per finished session containing that exercise, sorted asc by date, with computed metrics
  const out = [];
  DB.sessions.filter(s=>s.status==='finalizada').sort((a,b)=>new Date(a.end)-new Date(b.end)).forEach(s=>{
    const log = s.logs.find(l=>l.exId===exId);
    if(!log) return;
    const valid = log.sets.filter(st=>!st.aquecimento);
    if(!valid.length) return;
    const bestLoad = Math.max(...valid.map(st=>st.carga));
    const volume = valid.reduce((a,st)=>a+st.carga*st.reps,0);
    const avgPse = avg(valid.map(st=>st.pse));
    const e1rmCandidates = valid.filter(st=>st.reps>=3&&st.reps<=10).map(st=>epley(st.carga,st.reps));
    const e1rm = e1rmCandidates.length? Math.max(...e1rmCandidates) : null;
    const bestRepsAtBestLoad = Math.max(...valid.filter(st=>st.carga===bestLoad).map(st=>st.reps));
    out.push({date:s.date, sessionId:s.id, bestLoad, volume, avgPse, e1rm, bestRepsAtBestLoad, sets:valid, recommendation: log.recommendation});
  });
  return out;
}

function confirmSet(idx){
  const d = ROUTE.params.setDraft;
  const carga = parseFloat(d.carga), reps = parseInt(d.reps);
  if(isNaN(carga) || isNaN(reps)){ toast('Informe carga e repetições.'); return; }
  unlockAudio();
  const s = activeSession();
  const log = s.logs[idx];
  const newSet = { carga, reps, pse:d.pse, rir: d.mode==='rir'?d.rir:null, tecnica:d.tecnica, amplitude:d.amplitude, dor:d.dor, aquecimento:d.aquecimento, obs:d.obs, horario:new Date().toISOString() };
  const prior = prevWorkSets(log.exId, s.id).concat(log.sets.filter(st=>!st.aquecimento));
  const prs = detectPR(log.exId, newSet, prior);
  if(prs.length) newSet.pr = prs;
  log.sets.push(newSet);
  saveDB();
  ROUTE.params.lastPR = prs.length ? prs : null;
  if(prs.length){ toast('🏆 Novo recorde: '+prs.map(t=>PR_LABEL[t]).join(' + ')); try{ navigator.vibrate && navigator.vibrate(80); }catch(e){} }
  ROUTE.params.setDraft = null;
  if(!d.aquecimento){
    ROUTE.params.rest = { seconds: log.cfg.descanso || 90, total: log.cfg.descanso || 90, startedAt: Date.now() };
    startRestTicker();
  }
  render();
}
function deleteSet(idx, si){
  const s = activeSession(); s.logs[idx].sets.splice(si,1); saveDB(); render();
}
let restInterval=null;
function startRestTicker(){
  clearInterval(restInterval);
  restInterval = setInterval(()=>{
    if(!ROUTE.params.rest) { clearInterval(restInterval); return; }
    const r = ROUTE.params.rest;
    const elapsed = Math.floor((Date.now()-r.startedAt)/1000);
    r.seconds = Math.max(0, r.total - elapsed);
    const el = document.getElementById('restCountdown');
    if(el) el.textContent = fmtTime(r.seconds);
    const ring = document.getElementById('restRing');
    if(ring){ const pct = 1-(r.seconds/r.total); ring.style.background = `conic-gradient(var(--red) ${pct*360}deg, var(--surface-2) 0deg)`; }
    if(r.seconds<=0){ clearInterval(restInterval); restDone(); }
  },250);
}

function nextExercise(idx){
  const s = activeSession();
  s.logs[idx].recommendation = computeRecommendation(s.logs[idx].cfg, s.logs[idx].sets, exerciseHistory(s.logs[idx].exId), DB.profile.level);
  ROUTE.params.setDraft=null; ROUTE.params.rest=null;

  else { finishWorkout(); }

function confirmExitExecution(){
  askConfirm('Sair do treino?','Seu progresso fica salvo e você pode continuar depois pela tela inicial.','Sair', ()=>{ ROUTE.params.rest=null; clearInterval(restInterval); nav('home'); });
}
function finishWorkout(){
  const s = activeSession();
  s.logs.forEach(l=>{ if(!l.recommendation) l.recommendation = computeRecommendation(l.cfg, l.sets, exerciseHistory(l.exId), DB.profile.level); });
  s.status='finalizada'; s.end = new Date().toISOString();
  DB.activeSessionId=null;
  saveDB();
  nav('summary',{sessionId:s.id});
}

/* ============================= RECOMMENDATION ENGINE ============================= */
function computeRecommendedLoad(cfg, hist){
  if(cfg.tipo==='peso-corporal' && DB.profile.pesoCorporal){
    // Peso corporal é a própria carga: usa sempre o valor mais atual cadastrado no perfil,
    // em vez de "congelar" o peso da sessão em que o exercício foi registrado pela última vez.
    return round2(DB.profile.pesoCorporal);
  }
  if(!hist.length) return null;
  const last = hist[hist.length-1];
  const rec = last.recommendation;
  const inc = cfg.incremento || 0.5;
  if(rec && rec.rec==='aumentar') return round2(last.bestLoad + inc);
  if(rec && rec.rec==='manter_reduzir') return round2(last.bestLoad * 0.95);
  return round2(last.bestLoad);
}
function round2(n){ return Math.round(n*4)/4; }

function computeRecommendation(cfg, sets, hist, nivel){
  const work = sets.filter(st=>!st.aquecimento);
  if(!work.length) return {rec:'sem_dados', motivo:'Nenhuma série válida registrada para gerar recomendação.'};
  const dor = work.some(st=>st.dor);
  if(dor) return {rec:'interromper_dor', motivo:'Foi relatada dor ou desconforto incomum. Interrompa a progressão neste exercício e procure avaliação profissional caso persista.'};

  const tecnicaOk = work.every(st=>st.tecnica==='boa' && st.amplitude);
  const minAtingido = work.every(st=>st.reps>=cfg.repMin);
  const topoDominado = work.every(st=>st.reps>=cfg.repMax);
  const pseMedia = avg(work.map(st=>st.pse));
  const unidade = unit();

  if(!tecnicaOk){
    return {rec:'manter_reduzir', motivo:'A técnica ou amplitude não foram consideradas boas em todas as séries. Mantenha a carga atual ou reduza até restabelecer a execução correta.'};
  }
  if(!minAtingido){
    return {rec:'manter_reduzir', motivo:'O número mínimo de repetições da faixa prescrita não foi atingido em todas as séries. Mantenha ou reduza a carga entre 2% e 10% na próxima sessão.'};
  }
  if(pseMedia > cfg.pseAlvoMax + 0.5){
    return {rec:'manter_reduzir', motivo:`PSE média da sessão (${fmt1(pseMedia)}) acima do alvo (${cfg.pseAlvoMin}–${cfg.pseAlvoMax}). Mantenha ou reduza a carga.`};
  }

  if(nivel==='iniciante'){
    if(topoDominado && pseMedia<=8){
      return {rec:'aumentar', motivo:`Topo da faixa dominado, técnica boa e PSE ${fmt1(pseMedia)}. Aumente o menor incremento disponível (${cfg.incremento}${unidade}) na próxima sessão.`};
    }
    if(minAtingido && !topoDominado){
      return {rec:'manter_reps', motivo:'Dentro da faixa de repetições prescrita. Mantenha a carga e busque mais repetições na próxima sessão.'};
    }
    return {rec:'manter', motivo:'Mantenha a carga atual nesta sessão.'};
  }

  if(nivel==='intermediario'){
    const last3 = hist.slice(-2);
    const quedaQueda = work[0] && work[work.length-1] ? ((work[0].reps-work[work.length-1].reps)/work[0].reps) : 0;
    if(quedaQueda > 0.25){
      return {rec:'possivel_fadiga', motivo:'Queda superior a 25% entre a primeira e a última série. Pode indicar carga excessiva, descanso insuficiente ou fadiga acumulada.'};
    }
    const criterioAtingido = work.every(st=>st.reps>=Math.ceil(cfg.repMax*0.9)) && pseMedia<=9;
    if(criterioAtingido){
      const anteriorPendente = last3.length && last3[last3.length-1].recommendation && last3[last3.length-1].recommendation.rec==='aumentar_pendente';
      if(anteriorPendente){
        return {rec:'aumentar', motivo:`Critério de aumento confirmado por duas sessões consecutivas. Aumente ${cfg.incremento}${unidade}.`};
      }
      return {rec:'aumentar_pendente', motivo:'Critérios de aumento atingidos nesta sessão. Será confirmado se o resultado se repetir na próxima sessão.'};
    }
    // evolução de desempenho: mais reps com carga igual/PSE igual ou menor
    const prevAtSameLoad = hist.slice().reverse().find(h=>Math.abs(h.bestLoad - work[0].carga) < 0.001);
    if(prevAtSameLoad && work[work.length-1].reps > prevAtSameLoad.bestRepsAtBestLoad && pseMedia <= prevAtSameLoad.avgPse){
      return {rec:'evolucao_desempenho', motivo:'Aumento de repetições com carga igual e PSE semelhante ou menor. Evolução de desempenho registrada, mesmo sem troca de carga ainda.'};
    }
    return {rec:'manter', motivo:'Mantenha a carga e observe a consistência por mais sessões.'};
  }

  // avançado
  const e1rmSets = work.filter(st=>st.reps>=3 && st.reps<=10);
  const e1rm = e1rmSets.length ? Math.max(...e1rmSets.map(st=>epley(st.carga,st.reps))) : null;
  const trend = hist.slice(-3).map(h=>h.e1rm).filter(x=>x!=null);
  let trendMsg = '';
  if(trend.length>=2){
    const rising = trend[trend.length-1] > trend[0];
    trendMsg = rising ? ' Tendência do bloco em alta.' : ' Tendência do bloco estável ou em queda — avalie fadiga antes de progredir.';
  }
  if(topoDominado && pseMedia<=9 && trend.length>=2 && trend[trend.length-1] > trend[0]){
    return {rec:'aumentar', motivo:`e1RM em tendência de alta (estimativa: ${e1rm?fmt1(e1rm):'—'}${unidade}), técnica boa e PSE controlada.${trendMsg} Aumente ${cfg.incremento}${unidade} respeitando o incremento mínimo disponível.`};
  }
  return {rec:'analisar_tendencia', motivo:`${e1rm? 'e1RM estimado (Epley) desta sessão: '+fmt1(e1rm)+' '+unidade+'.' : 'Registre séries entre 3 e 10 repetições para estimar o e1RM.'}${trendMsg} Não recomendamos aumento com base em uma única sessão.`};
}

/* ============================= RECORDES PESSOAIS ============================= */
const PR_LABEL = { carga:'Carga máxima', e1rm:'1RM estimado', reps:'Mais repetições' };
function prevWorkSets(exId, excludeSessionId){
  const out=[];
  DB.sessions.forEach(s=>{
    if(s.status!=='finalizada' || s.id===excludeSessionId) return;
    s.logs.forEach(l=>{ if(l.exId===exId) l.sets.forEach(st=>{ if(!st.aquecimento) out.push(st); }); });
  });
  return out;
}
function detectPR(exId, set, prior){
  if(!prior.length || set.aquecimento) return [];
  const bw = exById(exId)?.tipo==='peso-corporal';
  const prs=[];
  if(!bw && set.carga > Math.max(...prior.map(p=>p.carga)) + 1e-9) prs.push('carga');
  if(!bw && !prs.includes('carga') && set.reps>=1 && set.reps<=12){
    const pe = prior.filter(p=>p.reps<=12).map(p=>epley(p.carga,p.reps));
    if(pe.length && epley(set.carga,set.reps) > Math.max(...pe) + 0.05) prs.push('e1rm');
  }
  const atLeast = prior.filter(p=>p.carga >= set.carga - 1e-9);
  if(atLeast.length && set.reps > Math.max(...atLeast.map(p=>p.reps))) prs.push('reps');
  return prs;
}
function prValue(st, type){
  if(type==='e1rm') return `${fmt1(epley(st.carga,st.reps))} ${unit()}`;
  if(type==='reps') return `${st.reps} reps com ${fmt1(st.carga)} ${unit()}`;
  return `${fmt1(st.carga)} ${unit()} × ${st.reps}`;
}
function recentPRs(limit=4){
  const out=[];
  DB.sessions.filter(s=>s.status==='finalizada').sort((a,b)=>new Date(b.end)-new Date(a.end)).forEach(s=>{
    s.logs.forEach(l=>l.sets.forEach(st=>{ if(st.pr && st.pr.length) out.push({date:s.date, exId:l.exId, st}); }));
  });
  return out.slice(0,limit);
}
function prBadge(types){
  return types.map(t=>`<span class="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded-md" style="background:var(--amber);color:var(--bg)">🏆 ${PR_LABEL[t]}</span>`).join(' ');
}

function muscleStats(){
  const now = Date.now(); const st = {};
  Object.keys(MUSC).forEach(k=>st[k]={last:null, load:0, sets7:0});
  DB.sessions.forEach(s=>{
    if(s.status!=='finalizada' && s.status!=='em_andamento') return;
    s.logs.forEach(l=>{
      const ex = exById(l.exId); if(!ex) return;
      const w = {}; (ex.prim||[]).forEach(m=>w[m]=1); (ex.sec||[]).forEach(m=>{ if(!w[m]) w[m]=0.5; });
      l.sets.forEach(set=>{
        if(set.aquecimento) return;
        const t = new Date(set.horario || s.end || s.start).getTime();
        const h = (now-t)/36e5; if(h<0 || isNaN(h)) return;
        Object.entries(w).forEach(([m,wt])=>{
          const o = st[m]; if(!o) return;
          if(!o.last || t>o.last) o.last=t;
          if(h<=96) o.load += wt*Math.exp(-h/36);
          if(h<=168) o.sets7 += wt;
        });
      });
    });
  });
  Object.values(st).forEach(o=>{
    const h = o.last ? (now-o.last)/36e5 : Infinity; o.hours = h;
    o.status = !o.last ? 'nunca' : (h<48 && o.load>=3) ? 'fadigado' : h<72 ? 'recuperando' : h<=192 ? 'pronto' : 'destreinado';
  });
  return st;
}
function fmtAgo(h){ if(!isFinite(h)) return 'nunca'; if(h<1) return 'agora há pouco'; if(h<24) return `há ${Math.round(h)} h`; const d=Math.floor(h/24); return `há ${d} dia${d>1?'s':''}`; }

}
function statusLegend(){

}
function homeMuscleCard(){

  const ready = Object.keys(st).filter(k=>st[k].status==='destreinado').map(k=>MUSC[k]);

/* ============================= BIBLIOTECA (tela) ============================= */
// Exercícios que já têm vídeo demonstrativo publicado em videos/<id>.mp4 (+ capa .jpg)
const EX_VIDEOS = new Set(['leg-press','supino-reto','elev-lateral','flexao','agac-pc','agac-livre','rosca-halteres','abdominal-crunch','stiff','cad-ext','afundo','hip-thrust','mesa-flex','prancha','puxada-frontal','rosca-direta','triceps-corda','remada-baixa','desenv-halter','supino-inclinado-halter','remada-unilateral','panturrilha','cadeira-flex','abducao','aducao','crucifixo-halter','peck-deck','crossover','hack','triceps-pulley','rosca-martelo','elev-frontal']);
function exVideo(id, maxH){
  if(!EX_VIDEOS.has(id)) return '';
  return `<div class="rounded-2xl overflow-hidden mb-4 mx-auto" style="background:#fff;max-width:${Math.round(maxH*9/16)}px">
    <video src="videos/${id}.mp4" poster="videos/${id}.jpg" autoplay loop muted playsinline preload="auto" class="w-full h-auto block" aria-label="Demonstração do exercício"></video>
  </div>`;
}
function exMeta(e){ return `${e.grupo||'Outros'}${e.equip? ' · '+(EQUIP_LABEL[e.equip]||e.equip):''}`; }
function filterExercises(q, g, eq){
  q = (q||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  return DB.exercises.filter(e=>{
    const n = e.nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    return (!q || n.includes(q)) && (!g || (e.grupo||'Outros')===g) && (!eq || e.equip===eq);
  }).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
function chipRow(items, current, onPick){
  return `<div class="scrollx flex gap-1.5 pb-1">
    ${items.map(([v,l])=>`<button onclick="${onPick}('${v}')" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold tap press ${ (current||'')===v ? 'bg-red text-white' : 'surface2' }">${l}</button>`).join('')}
  </div>`;
}
function libListHTML(){
  const p = ROUTE.params;
  const list = filterExercises(p.q, p.g, p.eq);
  if(!list.length) return '<div class="text-dim text-sm py-10 text-center">Nenhum exercício encontrado.</div>';
  return list.map(e=>{
    const n = exerciseHistory(e.id).length;
    return `<button onclick="nav('exerciseDetail',{id:'${e.id}',from:'library'})" class="w-full surface rounded-xl px-3.5 py-3 text-left tap press flex items-center gap-3">
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold truncate">${e.nome}${e.custom?' <span class="text-[10px] text-dim font-normal">(seu)</span>':''}</div>
        <div class="text-xs text-dim truncate">${exMeta(e)}</div>
      </div>
      ${n ? `<span class="text-[11px] text-dim shrink-0">${n} sessão${n>1?'ões':''}</span>` : ''}
    </button>`;
  }).join('');
}
function libPickG(v){ ROUTE.params.g = ROUTE.params.g===v ? '' : v; render(); }
function libPickEq(v){ ROUTE.params.eq = ROUTE.params.eq===v ? '' : v; render(); }
function screenLibrary(){
  const p = ROUTE.params;
  const total = filterExercises(p.q, p.g, p.eq).length;
  return `<div class="fade-in px-5 pt-8">
    <div class="flex items-center justify-between mb-4">
      <h1 class="headline text-2xl">Exercícios</h1>
      <button onclick="MODAL={html:customExerciseForm('')}; render()" class="bg-red text-white rounded-full w-10 h-10 flex items-center justify-center text-xl tap press" aria-label="Criar exercício">+</button>
    </div>
    <input id="libSearch" type="text" placeholder="Buscar entre ${DB.exercises.length} exercícios..." value="${p.q||''}" oninput="ROUTE.params.q=this.value; document.getElementById('libList').innerHTML=libListHTML()" class="w-full rounded-xl px-3.5 py-3 mb-3 text-sm">
    <div class="mb-2">${chipRow([['','Todos'],...GRUPOS.map(g=>[g,g])], p.g||'', 'libPickG')}</div>
    <div class="mb-3">${chipRow(Object.entries(EQUIP_LABEL), p.eq||'', 'libPickEq')}</div>
    <div class="text-[11px] text-dim mb-2 px-1">${total} exercício(s)</div>
    <div id="libList" class="space-y-1.5 pb-4">${libListHTML()}</div>
  </div>`;
}
function screenExerciseDetail(id){

  return `<div class="fade-in px-5 pt-8 pb-6">
    <button onclick="nav('${back}')" class="text-dim text-sm mb-4 tap">← ${backLabel}</button>
    <h1 class="headline text-2xl mb-1">${ex.nome}</h1>

    ${exVideo(id, 420)}
    <div class="surface rounded-2xl p-4 mb-4">
      ${bodyMap(k=> prim.includes(k) ? {fill:'var(--red)',op:1} : sec.includes(k) ? {fill:'var(--red)',op:.4} : {fill:'var(--dim)',op:.15}, {max:300})}
      <div class="flex justify-center gap-4 mt-3 text-[11px] text-dim">
        <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 rounded-full" style="background:var(--red)"></span>Principal</span>
        <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 rounded-full" style="background:var(--red);opacity:.4"></span>Secundário</span>
      </div>
    </div>
    <div class="surface rounded-2xl p-4 mb-4">
      <div class="text-[11px] text-dim font-semibold mb-1.5">MÚSCULOS PRINCIPAIS</div>
      <div class="flex flex-wrap gap-1.5 mb-3">${prim.length? prim.map(m=>`<span class="bg-red-dim text-red rounded-lg px-2.5 py-1 text-xs font-semibold">${MUSC[m]}</span>`).join('') : '<span class="text-xs text-dim">Não definido</span>'}</div>
      ${sec.length ? `<div class="text-[11px] text-dim font-semibold mb-1.5">SECUNDÁRIOS</div>
      <div class="flex flex-wrap gap-1.5">${sec.map(m=>`<span class="surface2 rounded-lg px-2.5 py-1 text-xs">${MUSC[m]}</span>`).join('')}</div>` : ''}
    </div>
    ${hist.length ? `<div class="grid grid-cols-3 gap-2 mb-3">
      <div class="surface rounded-xl p-3 text-center"><div class="num text-base">${fmt1(best)}</div><div class="text-[10px] text-dim">Melhor carga</div></div>
      <div class="surface rounded-xl p-3 text-center"><div class="num text-base">${e1.length?fmt1(Math.max(...e1)):'—'}</div><div class="text-[10px] text-dim">1RM estimado</div></div>
      <div class="surface rounded-xl p-3 text-center"><div class="num text-base">${hist.length}</div><div class="text-[10px] text-dim">Sessões</div></div>
    </div>
    <button onclick="nav('exerciseHistory',{exId:'${id}'})" class="w-full py-3 rounded-xl surface text-sm font-semibold mb-3 tap press">Ver histórico completo</button>` : ''}
    <button onclick="openAddToWorkout('${id}')" class="w-full btn-big bg-red text-white rounded-xl font-semibold tap press">Adicionar a um treino</button>
  </div>`;
}
function openAddToWorkout(exId){
  if(!DB.workouts.length){ toast('Crie um treino primeiro na aba Treinos.'); return; }
  MODAL = { html: `<div class="font-semibold text-lg mb-3">Adicionar a qual treino?</div>
    <div class="space-y-1.5 mb-3">${DB.workouts.map(w=>`<button onclick="addToWorkoutFromLib('${w.id}','${exId}')" class="w-full surface2 rounded-xl px-3.5 py-3 text-left text-sm font-semibold tap press">${w.nome} <span class="text-dim font-normal text-xs">· ${w.exercicios.length} exerc.</span></button>`).join('')}</div>

function addToWorkoutFromLib(wid, exId){
  const w = DB.workouts.find(x=>x.id===wid); const ex = exById(exId);
  w.exercicios.push({exId, series:3, repMin:8, repMax:12, pseAlvoMin:7, pseAlvoMax:8, descanso:90, incremento: ex.incremento, tipo: ex.tipo, obs:''});
  saveDB(); MODAL=null; toast(`Adicionado ao ${w.nome}.`); render();
}
function customExerciseForm(wid){
  return `<div class="font-semibold text-lg mb-3">Novo exercício</div>

      <select id="cexEquip" class="w-full rounded-xl px-3 py-2.5 text-sm">${Object.entries(EQUIP_LABEL).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select>
    </div>
    <div class="grid grid-cols-2 gap-2 mb-4">
      <select id="cexTipo" class="w-full rounded-xl px-3 py-2.5 text-sm">${['composto','isolado','maquina','peso-livre','peso-corporal'].map(t=>`<option value="${t}">${t}</option>`).join('')}</select>

/* ============================= EDITAR SÉRIES (substitui prompt) ============================= */
function editSessionSet(sessionId, exId){
  const s = DB.sessions.find(x=>x.id===sessionId);
  const log = s && s.logs.find(l=>l.exId===exId);
  if(!log) return;
  MODAL = { html: `<div class="font-semibold text-lg mb-1">Editar séries</div>
    <div class="text-xs text-dim mb-3">${exName(exId)} · ${dateBR(s.date)}</div>
    <div class="space-y-2 mb-4 max-h-[50vh] overflow-y-auto">
      ${log.sets.map((st,i)=>`<div class="grid grid-cols-[64px_1fr_1fr] gap-2 items-center">
        <div class="text-xs text-dim">${st.aquecimento?'Aquec.':'Série '+(i+1)}</div>
        <input id="es-c-${i}" type="number" step="0.5" inputmode="decimal" value="${st.carga}" class="rounded-lg px-2 py-2 text-sm num text-center" aria-label="Carga">
        <input id="es-r-${i}" type="number" inputmode="numeric" value="${st.reps}" class="rounded-lg px-2 py-2 text-sm num text-center" aria-label="Repetições">
      </div>`).join('')}
    </div>
    <div class="flex gap-2">
      <button onclick="closeModal()" class="flex-1 py-3 rounded-xl surface2 text-sm font-semibold tap press">Cancelar</button>
      <button onclick="saveEditedSets('${sessionId}','${exId}')" class="flex-1 py-3 rounded-xl bg-red text-white text-sm font-semibold tap press">Salvar</button>
    </div>` };
  render();
}
function saveEditedSets(sessionId, exId){
  const s = DB.sessions.find(x=>x.id===sessionId); const log = s.logs.find(l=>l.exId===exId);
  log.sets.forEach((st,i)=>{
    const c = parseFloat(document.getElementById('es-c-'+i)?.value), r = parseInt(document.getElementById('es-r-'+i)?.value);
    if(!isNaN(c)) st.carga=c; if(!isNaN(r)) st.reps=r;
  });
  saveDB(); MODAL=null; toast('Séries atualizadas.'); render();
}

/* ============================= ÁUDIO / TELA ACESA ============================= */
let audioCtx = null;
function unlockAudio(){
  try { audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); } catch(e){}
}
function beep(){
  try {
    if(!audioCtx) return;
    [0, 0.25, 0.5].forEach((t,i)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='sine'; o.frequency.value = i===2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+t+(i===2?0.45:0.18));
      o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.5);
    });
  } catch(e){}
}
let wakeLock = null;
async function syncWakeLock(){
  try {
    if(ROUTE.screen==='execution'){ if(!wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener && wakeLock.addEventListener('release', ()=>{ wakeLock=null; }); } }
    else if(wakeLock){ await wakeLock.release(); wakeLock=null; }
  } catch(e){ wakeLock=null; }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') syncWakeLock(); });
function restDone(){
  ROUTE.params.rest = null; ROUTE.params.lastPR = null;
  beep();
  try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){}
  if(ROUTE.screen==='execution') render();
  toast('Descanso concluído. Bora pra próxima série!');
}
function adjustRest(delta){
  const r = ROUTE.params.rest; if(!r) return;
  r.total = Math.max(5, r.total + delta);
  const left = r.total - Math.floor((Date.now()-r.startedAt)/1000);
  if(left<=0){ clearInterval(restInterval); restDone(); return; }
  r.seconds = left;
  const el = document.getElementById('restCountdown'); if(el) el.textContent = fmtTime(left);
}

/* ============================= INIT ============================= */
if(DB.profile) document.documentElement.setAttribute('data-theme', DB.profile.theme);
else document.documentElement.setAttribute('data-theme','dark');
render();
</script>
